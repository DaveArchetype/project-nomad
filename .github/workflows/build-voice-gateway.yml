name: Build Voice Gateway Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to label the Docker image under (no "v" prefix, e.g. "1.0.0")'
        required: true
        type: string
      tag_latest:
        description: 'Also tag this image as :latest?'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build voice-gateway image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.dasaroff.com
          username: ${{ secrets.GITEA_REGISTRY_USERNAME }}
          password: ${{ secrets.GITEA_REGISTRY_TOKEN }}
      - name: Compute lowercase registry namespace
        # Docker repository names must be all-lowercase; the Gitea username itself (e.g.
        # "DaveArchetype") isn't, so build the tag from a lowercased copy instead of the raw
        # secret. `::add-mask::` re-registers the lowercased value so it's still redacted in logs.
        id: registry_ns
        env:
          USERNAME: ${{ secrets.GITEA_REGISTRY_USERNAME }}
        run: |
          LOWER="${USERNAME,,}"
          echo "::add-mask::$LOWER"
          echo "namespace=$LOWER" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: install/voice-gateway
          push: true
          tags: |
            registry.dasaroff.com/${{ steps.registry_ns.outputs.namespace }}/project-nomad-voice-gateway:${{ inputs.version }}
            ${{ inputs.tag_latest && format('registry.dasaroff.com/{0}/project-nomad-voice-gateway:latest', steps.registry_ns.outputs.namespace) || '' }}
