# Project NOMAD management services Docker Compose configuration
#
# This compose file defines the admin server, database, and other supporting services required to run Project NOMAD
# You can use this with `docker-compose up -d` to start all the necessary services with a single command after installation.
#
# Note: we recommend leaving all of the environment variables as-is except for any "replaceme" values,
# which must be updated for the admin server to start successfully. The default values are optimized for ease of installation and use,
# but you can customize them as needed (e.g. changing ports, database connection details, log level, etc.)
name: project-nomad
services:
  admin:
    build: https://github.com/DaveArchetype/project-nomad.git
    image: project-nomad-admin
    container_name: nomad_admin
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Enables host.docker.internal on Linux
    ports:
      - "80:8080"
    volumes:
      # RELOCATING STORAGE: the host path on the LEFT of the colon below is the single source of
      # truth for where all NOMAD data lives (ZIMs, AI models, notes, etc.). At runtime the admin
      # inspects this mount and points every child app (Kiwix, Ollama, etc.) at the same host
      # location automatically, so you do NOT edit each service. To move storage:
      #   1. Stop NOMAD (`docker compose down`) and MOVE the existing data to the new location,
      #      keeping the subfolders intact (e.g. <new-path>/zim, <new-path>/models). Pointing at an
      #      empty folder gives an empty Information Library, not your existing content.
      #   2. Change the host path on the left of the colon below to the new location.
      #   3. Set it EXACTLY the same in NOMAD_STORAGE_PATH and the disk-collector volume (both below).
      #      Paths are case-sensitive (/mnt/Data != /mnt/data); a mismatch makes Docker create a new
      #      empty folder, which is the usual cause of "my content disappeared after moving it".
      - /mnt/main2tb/project-nomad/storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock # Allows the admin service to communicate with the Host's Docker daemon
      - nomad-update-shared:/app/update-shared # Shared volume for update communication
    environment:
      - NODE_ENV=production
      # NOMAD_STORAGE_PATH should equal the host path of the /app/storage volume above. The admin
      # normally auto-detects that mount, so this is a fallback used only if the container can't be
      # inspected. Keep it in sync anyway so the fallback never sends child apps to the wrong place.
      - NOMAD_STORAGE_PATH=/mnt/main2tb/project-nomad/storage
      # PORT is the port the admin server listens on *inside* the container and should not be changed. If you want to change which port the admin interface is accessible from on the host, you can change the port mapping in the "ports" section (e.g. "9090:8080" to access it on port 9090 from the host)
      - PORT=8080
      - LOG_LEVEL=info
      # APP_KEY needs to be at least 16 chars or will fail validation and container won't start!
      - APP_KEY=${APP_KEY}
      # # Leave HOST as is so the admin server listens all interfaces within the container - this doesn't affect how you access it from the host, it's just for internal container networking
      - HOST=0.0.0.0
      # URL should be set to the URL you will access the admin interface at (e.g. http://localhost:8080 or http://192.168.1.x:8080)
      - URL=${URL}
      - DB_HOST=mysql
      # If you change the MySQL port, make sure to update this accordingly
      - DB_PORT=3306
      - DB_DATABASE=nomad
      - DB_USER=nomad_user
      # Needs to match the MYSQL_PASSWORD in the mysql service!
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=nomad
      - DB_SSL=false
      - REDIS_HOST=redis
      # If you change the Redis port, make sure to update this accordingly
      - REDIS_PORT=6379
      - DISABLE_COMPRESSION=false # Most reverse proxies (Nginx, Caddy, etc.) will skip compression if the response is already compressed so this is usally a win all around, but if this causes issues with your setup you can set it to "true" to disable gzip in the admin server
      # Worker runs in the dedicated `worker` service below (with restart: unless-stopped
      # so a crash is recovered automatically). Setting this to false stops the admin
      # container from also launching an unsupervised in-process worker that wedges the
      # queue when it dies. Default in entrypoint.sh is true, so existing installs that
      # haven't adopted the worker service keep working.
      - START_WORKER=false
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    # Dedicated BullMQ worker container. Same image as admin, but its entrypoint is
    # overridden to run `node ace queue:work --all` directly (no web server). With
    # `restart: unless-stopped`, a worker crash — which previously stranded every
    # embedding job in "active"/"waiting" forever because the in-entrypoint `&`
    # worker had no supervisor — is now recovered automatically within seconds.
    image: project-nomad-admin
    container_name: nomad_worker
    restart: unless-stopped
    # The Dockerfile's entrypoint.sh (which waits for Redis, runs migrations,
    # etc.) is bypassed here. depends_on: admin: service_healthy covers a clean
    # `up`, but NOT a `docker compose restart worker` — so inline a Redis wait
    # to avoid BullMQ racing a freshly-restarted Redis container's stale IP.
    entrypoint:
      - "sh"
      - "-c"
      - >
        until node -e "const s=require('net').connect(Number(process.env.REDIS_PORT||6379),process.env.REDIS_HOST||'redis');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))" 2>/dev/null; do
          sleep 1;
        done &&
        exec node ace queue:work --all
    volumes:
      - /mnt/main2tb/project-nomad/storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - nomad-update-shared:/app/update-shared
    environment:
      - NODE_ENV=production
      - NOMAD_STORAGE_PATH=/mnt/main2tb/project-nomad/storage
      - LOG_LEVEL=info
      - APP_KEY=${APP_KEY}
      - HOST=0.0.0.0
      - URL=${URL}
      - PORT=8080
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=nomad
      - DB_USER=nomad_user
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=nomad
      - DB_SSL=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DISABLE_COMPRESSION=false
    depends_on:
      admin:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  dozzle:
    # Dozzle is an optional container that allows for easily viewing container logs. We recommend including it unless you have a specific reason not to. Note that if you don't install it, the "Service Logs & Metrics" link in Settings that launches Dozzle will not work.
    image: amir20/dozzle:latest
    container_name: nomad_dozzle
    restart: unless-stopped
    ports:
      - "3501:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Allows Dozzle to read logs from the Host's Docker daemon
    environment:
      - DOZZLE_ENABLE_ACTIONS=false # Disabled — unauthenticated container stop/restart on LAN
      - DOZZLE_ENABLE_SHELL=false  # Disabled — shell access + Docker socket = privilege escalation
  mysql:
    image: mysql:8.0
    container_name: nomad_mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=nomad
      - MYSQL_USER=nomad_user
      # Needs to match DB_PASSWORD in the admin service!
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - /mnt/main2tb/project-nomad/mysql:/var/lib/mysql # Persist MySQL data on the host. This path can be changed if needed, just make sure it's writable by the container. Host persistence is important for the database to ensure your data isn't lost when the container is removed or updated.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: nomad_redis
    restart: unless-stopped
    volumes:
      - /mnt/main2tb/project-nomad/redis:/data # Persist Redis data on the host. This path can be changed if needed, just make sure it's writable by the container. Host persistence is important for Redis to ensure your data isn't lost when the container is removed or updated.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
  updater:
    # Updater is a lightweight sidecar container that allows the admin container to be updated from within it's own UI
    image: ghcr.io/crosstalk-solutions/project-nomad-sidecar-updater:latest
    pull_policy: always
    container_name: nomad_updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Allows communication with the Host's Docker daemon
      - /mnt/main2tb/project-nomad:/mnt/main2tb/project-nomad # Writable access required so the updater can set the correct image tag in compose.yml. This needs to be the same location that the compose file is located at on the host for the updater to work correctly
      - nomad-update-shared:/shared # Shared volume for communication with admin container
  disk-collector:
    # Disk Collector is a lightweight privileged container that collects disk usage information from the host system and shares it with the admin container so it can be displayed in the UI.
    # It requires read-only access to the host filesystem and is designed to be as secure and limited in scope as possible while still providing the necessary functionality.
    image: ghcr.io/crosstalk-solutions/project-nomad-disk-collector:latest
    pull_policy: always
    container_name: nomad_disk_collector
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave  # Read-only view of host FS with rslave propagation so /sys and /proc submounts are visible
      # If you relocated storage (see the admin service above), set this host path to match EXACTLY,
      # or the host disk-usage figures shown in the UI will point at the wrong location.
      - /mnt/main2tb/project-nomad/storage:/storage
  tei:
    # Text Embeddings Inference (TEI) — HuggingFace's purpose-built embedding server.
    # Runs nomic-embed-text-v1.5 on GPU with proper batched inference, 10-50x faster
    # than Ollama for embedding workloads. OllamaService.embed() auto-detects this
    # container and routes embeddings here; if TEI is down, it falls back to Ollama.
    # The model is downloaded from HuggingFace on first start (~550MB).
    #
    # IMPORTANT: TEI ships separate CUDA images per GPU compute capability (it compiles
    # dedicated flash-attention/cutlass kernels per architecture). The unsuffixed tag
    # (e.g. "1.9") targets Ampere 8.0 (A100/A30) ONLY. Using it on a different GPU
    # silently falls back to a much slower dispatch path — symptoms look like: GPU
    # stuck at 100% utilization but VRAM usage barely rising, and wildly inconsistent
    # throughput. Pick the tag matching your GPU's compute capability:
    #   Turing (T4, RTX 2000 series)         -> turing-1.9
    #   Ampere 8.0 (A100, A30)                -> 1.9
    #   Ampere 8.6 (RTX 3090, A10, A40, ...)  -> 86-1.9   (default here)
    #   Ada Lovelace (RTX 4000 series)        -> 89-1.9
    #   Hopper (H100)                          -> hopper-1.9
    # See https://huggingface.co/docs/text-embeddings-inference/supported_models
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.9
    pull_policy: always
    container_name: nomad_tei
    restart: unless-stopped
    ports:
      - "8181:80"
    volumes:
      - /mnt/main2tb/project-nomad/tei-data:/data
    command: ["--model-id", "nomic-ai/nomic-embed-text-v1.5", "--revision", "e5cf08aadaa33385f5990def41f7a23405aec398", "--port", "80", "--max-client-batch-size", "512", "--max-concurrent-requests", "2048", "--max-batch-tokens", "375000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  # Voice Assistant (voice-gateway + tts) — previously built from source here, now installed
  # as two regular Supply Depot apps ("Voice Gateway" / "Text-to-Speech") via the admin UI's
  # own dynamic installer, which pulls versioned images from the private Gitea registry
  # instead of building locally. Set the registry credentials under Supply Depot > Private
  # Registry Credentials before installing/updating either one. The blocks below are kept,
  # commented out, as a manual/advanced fallback if you ever need to build from source again.
  # voice-gateway:
  #   # Voice Assistant — CPU-only ambient listening (wake word + speech-to-text). Built locally
  #   # from source (install/voice-gateway/) rather than pulled from a registry, same as `admin`
  #   # above — no image is published for this anywhere. The `#main:install/voice-gateway` suffix
  #   # tells Docker to use that subdirectory of the repo as the build context. This MUST point at
  #   # a repo/branch YOU control (same as the `admin` service's build line above). Note: a git-URL
  #   # build always fetches from the remote, so local edits must be committed and pushed to `main`
  #   # before `docker compose build` will pick them up.
  #   build: https://github.com/DaveArchetype/project-nomad.git#main:install/voice-gateway
  #   image: project-nomad-voice-gateway
  #   container_name: nomad_voice_gateway
  #   restart: unless-stopped
  #   # No host port mapping — only the admin/worker containers talk to this, over the Docker
  #   # network by container name (see VoiceGatewayClientService). Uncomment to debug directly:
  #   # ports:
  #   #   - "8601:8600"
  #   volumes:
  #     - /mnt/main2tb/project-nomad/storage/voice-gateway:/data
  #   environment:
  #     - WHISPER_MODEL_SIZE=base
  #     - WHISPER_LANGUAGE=auto
  #     - WAKE_WORD_PRESET=hey_jarvis
  #     - WAKE_WORD_SENSITIVITY=0.5
  #     - VAD_SENSITIVITY=2
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8600/health')"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  # tts:
  #   # Voice Assistant — CPU-only text-to-speech (Piper). Built locally from source
  #   # (install/tts/), same rationale as voice-gateway above — point the build URL at a
  #   # repo/branch YOU control.
  #   build: https://github.com/DaveArchetype/project-nomad.git#main:install/tts
  #   image: project-nomad-tts
  #   container_name: nomad_tts
  #   restart: unless-stopped
  #   # ports:
  #   #   - "8611:8610"
  #   volumes:
  #     - /mnt/main2tb/project-nomad/storage/tts:/data
  #   environment:
  #     - DEFAULT_VOICE=en_US-lessac-medium
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8610/health')"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

volumes:
  nomad-update-shared:
    driver: local
