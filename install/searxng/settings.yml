use_default_settings: true

general:
  instance_name: "Project NOMAD Search"
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "__SEARXNG_SECRET_KEY__"
  limiter: false
  image_proxy: true
  bind_address: "0.0.0.0"
  port: 8080

ui:
  static_use_hash: true

outgoing:
  request_timeout: 10
  max_request_timeout: 15
  useragent_suffix: ""
